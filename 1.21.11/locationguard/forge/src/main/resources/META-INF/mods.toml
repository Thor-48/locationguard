modLoader="javafml"
loaderVersion="[${forge_spec_version},)"
license="MIT"

[[mods]]
modId="locationguard"
version="${version}"
displayName="Location Guard"
authors="Location Guard"
description='''
Hides location details from the debug screen and chat. Client-side settings are in config/locationguard.json.
'''

[[dependencies.locationguard]]
    modId="forge"
    mandatory=true
    versionRange="[${forge_spec_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.locationguard]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_dependency}"
    ordering="NONE"
    side="CLIENT"
