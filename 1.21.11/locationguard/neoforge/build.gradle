plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${project.minecraft_version}-neoforge"
}

sourceSets {
	main {
		java.srcDir "${rootDir}/common/src/main/java"
		resources.srcDir "${rootDir}/common/src/main/resources"
	}
}

neoForge {
	version = project.neo_version
	runs {
		client {
			client()
		}
	}
	mods {
		"${project.archives_base_name}" {
			sourceSet(sourceSets.main)
		}
	}
}

processResources {
	def modVersion = project.version
	def minecraftDependency = project.minecraft_dependency
	def neoforgeDependency = project.neoforge_dependency
	inputs.property "version", modVersion
	inputs.property "minecraft_dependency", minecraftDependency
	inputs.property "neoforge_dependency", neoforgeDependency
	inputs.property "mixin_refmap", "none"
	filesMatching("locationguard.mixins.json") {
		filter { line -> line.replace('"refmap": "locationguard.refmap.json",', '') }
	}
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": modVersion, "minecraft_dependency": minecraftDependency, "neoforge_dependency": neoforgeDependency
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = Integer.parseInt(project.java_version)
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
	}
}
